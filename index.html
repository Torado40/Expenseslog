<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spend Log">
<title>Spend Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sibling of Plate Log — sticky header, wallet cards with today's allowance, bottom tabs, bottom sheets for entry. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e7ede9; --ink:#15201b; --muted:#59665f; --faint:#8a958e; --line:#dbe3dd;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --good:#1f7a43; --bad:#c23b33; --bad-soft:#f8e1df; --good-soft:#dff0e4; --warn:#a86a00;
  --w-personal:#2a78d6; --w-fuel:#eb6834; --w-home:#1baf7a;
  --shadow:0 1px 2px rgba(21,32,27,.06),0 6px 24px rgba(21,32,27,.08);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a201d; --surface-2:#242b27; --ink:#edf2ef; --muted:#a3afa8; --faint:#77827b; --line:#2d3631;
  --accent:#4fbf9c; --accent-ink:#0b1712; --accent-soft:#1d3a31;
  --good:#5cc483; --bad:#f07a70; --bad-soft:#3d2321; --good-soft:#1e3326; --warn:#e0a63a;
  --w-personal:#3987e5; --w-fuel:#d95926; --w-home:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a201d; --surface-2:#242b27; --ink:#edf2ef; --muted:#a3afa8; --faint:#77827b; --line:#2d3631;
  --accent:#4fbf9c; --accent-ink:#0b1712; --accent-soft:#1d3a31;
  --good:#5cc483; --bad:#f07a70; --bad-soft:#3d2321; --good-soft:#1e3326; --warn:#e0a63a;
  --w-personal:#3987e5; --w-fuel:#d95926; --w-home:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top h1{font-size:26px;line-height:1.1}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.total{padding:16px;display:grid;gap:10px}
.total .big{font:700 34px/1 var(--f-display)}
.total .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.total .row b{color:var(--ink)}
.wallets{display:grid;gap:12px;margin-top:14px}
.wallet{padding:14px 16px;display:grid;gap:10px;border:0;text-align:left;width:100%}
.wallet .h{display:flex;align-items:center;gap:8px}
.wallet .h h2{font-size:18px;flex:1}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.wallet .today{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wallet .today .v{font:700 28px/1 var(--f-display)}
.wallet .today .l{font-size:13px;color:var(--muted)}
.track{position:relative;height:8px;border-radius:4px;background:var(--surface-2);overflow:visible}
.fill{height:100%;border-radius:4px}
.pace{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:14px;font-weight:700}
.pos{color:var(--good)!important} .neg{color:var(--bad)!important}
.sec-t{margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-t h2{font-size:17px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.row:first-child{border-top:0}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-weight:700;flex:none}
.row .r small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%;display:block;text-align:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 8px 24px rgba(31,111,92,.35);padding:14px 22px;border-radius:999px;display:flex;gap:8px;align-items:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 0 8px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sheet-h h2{font-size:20px;flex:1;min-width:0}
.sheet-b{overflow:auto;padding:0 16px 18px;flex:1;min-height:0}
.sheet-f{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.amount{width:100%;font:700 36px/1.1 var(--f-display);text-align:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.calc{text-align:center;font-size:14px;color:var(--muted);min-height:20px;margin-top:4px}
.wchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.wchip{padding:12px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center}
.wchip.on{border-color:var(--ink)}
.form{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
label.f .hint{font-weight:500;color:var(--faint)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--accent-soft)}
.banner.warn{background:var(--bad-soft)}
.chart{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 8px 8px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,0)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 8px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:8px 6px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 6px;border-top:1px solid var(--line);text-align:right}
table.t tr.click{cursor:pointer}
.tbl{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 8px;overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;font-weight:600;max-width:90%}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;margin-left:10px}
.daybar{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-weight:700}
.daybar span{font-weight:600;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<script>
(() => {
'use strict';
const I = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const WALLETS = [{k:'personal', label:'Personal', color:'var(--w-personal)'},{k:'fuel', label:'Fuel', color:'var(--w-fuel)'},{k:'home', label:'Home', color:'var(--w-home)'}];
const WL = Object.fromEntries(WALLETS.map(w => [w.k, w]));
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const todayKey = () => keyOf(new Date());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtShort = k => { const d = parseKey(k); return d.getDate()+' '+MON[d.getMonth()]; };
const fmtDay = k => { const t = todayKey(); if (k === t) return 'Today'; if (k === addDays(t,-1)) return 'Yesterday'; const d = parseKey(k); return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]; };
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const money = v => { v = Math.round(v || 0); return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('en-US'); };
const signed = v => (v > 0.5 ? '+' : '') + money(v);
// safe arithmetic: numbers, + - * / ( )
function calc(str) {
  const s = String(str || '').replace(/[,\s]/g, '').replace(/×/g,'*').replace(/÷/g,'/').replace(/^=/, '');
  if (!s) return null;
  if (!/^[\d.+\-*/()]+$/.test(s)) return NaN;
  let i = 0;
  const peek = () => s[i];
  function num() { if (peek() === '(') { i++; const v = expr(); if (peek() !== ')') throw 0; i++; return v; }
    if (peek() === '-') { i++; return -num(); } if (peek() === '+') { i++; return num(); }
    const m = s.slice(i).match(/^\d*\.?\d+/); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
  function term() { let v = num(); while (peek() === '*' || peek() === '/') { const o = s[i++]; const r = num(); v = o === '*' ? v*r : v/r; } return v; }
  function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const o = s[i++]; const r = term(); v = o === '+' ? v+r : v-r; } return v; }
  try { const v = expr(); if (i !== s.length || !isFinite(v)) return NaN; return Math.round(v*100)/100; } catch { return NaN; }
}
const isExpr = s => /[+\-*/]/.test(String(s||'').replace(/^-/, ''));

// ---------- state & storage ----------
const KEY = 'sl-data';
const S = { tab:'today', data:{cycles:[], entries:[], settings:{currency:'EGP'}}, histCycle:null, histWallet:'all', lastWallet:'personal' };
function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.cycles) S.data = d; } catch {} try { const u = JSON.parse(localStorage.getItem('sl-ui') || '{}'); if (u.lastWallet) S.lastWallet = u.lastWallet; } catch {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S.data)); } catch { toast('Couldn’t save on this browser. Back up your data.'); } }
const saveUi = () => { try { localStorage.setItem('sl-ui', JSON.stringify({lastWallet:S.lastWallet})); } catch {} };
const cur = () => S.data.settings?.currency || 'EGP';

// ---------- cycles ----------
const sortedCycles = () => [...S.data.cycles].sort((a,b) => a.start.localeCompare(b.start));
const cycleFor = k => S.data.cycles.find(c => c.start <= k && k <= c.end) || null;
function nextCycleFrom(prev) {
  const start = addDays(prev.end, 1);
  const len = daysBetween(prev.start, prev.end);   // keep the same length as the previous cycle
  const end = addDays(start, len);
  return { id:start, start, end, budgets: JSON.parse(JSON.stringify(prev.budgets)), billsFund: prev.billsFund || 0,
    items: (prev.items || []).map(it => ({...it, bought:0, openingPaid:0})) };
}
function ensureCurrent() {
  const t = todayKey(); if (!S.data.cycles.length || cycleFor(t)) return false;
  let made = 0, last = sortedCycles().at(-1);
  if (last.start > t) return false;
  while (last.end < t && made < 24) { const n = nextCycleFrom(last); S.data.cycles.push(n); last = n; made++; }
  if (made) { save(); setTimeout(() => toast(`New cycle started: ${fmtShort(last.start)} – ${fmtShort(last.end)}. Budgets carried over.`), 400); }
  return made > 0;
}
function cycleDays(c) { return daysBetween(c.start, c.end) + 1; }
function entriesIn(c, wallet) { return S.data.entries.filter(e => e.date >= c.start && e.date <= c.end && (!wallet || e.wallet === wallet)); }
// metrics for one wallet in one cycle, as of a date
function metrics(c, wallet, asOf = todayKey()) {
  const N = cycleDays(c), B = +c.budgets?.[wallet]?.value || 0;
  const at = asOf < c.start ? c.start : asOf > c.end ? c.end : asOf;
  const past = asOf > c.end;
  const elapsed = daysBetween(c.start, at) + 1, daysLeft = Math.max(1, N - elapsed + 1);
  let before = 0, today = 0, off = 0;
  for (const e of entriesIn(c, wallet)) {
    if (wallet === 'home' && e.itemId) { off += e.amount; continue; }  // off-balance list/bill purchases
    if (e.date < at) before += e.amount; else if (e.date === at) today += e.amount; else if (past) before += e.amount;
  }
  const spent = before + today, daily = B / N, pace = daily * elapsed;
  const allowToday = (B - before) / daysLeft;
  return { N, B, elapsed, daysLeft, spent, today, off, daily, pace, buffer: pace - spent, remaining: B - spent,
    allowToday, leftToday: allowToday - today, fromTomorrow: daysLeft > 1 ? (B - spent) / (daysLeft - 1) : 0,
    trend: spent / elapsed, projected: spent / elapsed * N, past };
}

// ---------- render ----------
function render() {
  renderTabs();
  const a = $('#app');
  if (!S.data.cycles.length) { a.innerHTML = viewWelcome(); return; }
  a.innerHTML = S.tab === 'today' ? viewToday() : S.tab === 'history' ? viewHistory() : S.tab === 'home' ? viewHome() : viewSettings();
  if (S.tab === 'history') wireChart();
}
function renderTabs() {
  const t = [['today','Today',I.today],['history','History',I.hist],['home','Home list',I.home],['settings','Budgets',I.gear]];
  $('#tabs').innerHTML = t.map(([id,l,ic]) => `<button data-act="tab" data-v="${id}" class="${S.tab===id?'on':''}">${ic}<span>${l}</span></button>`).join('');
}
function viewWelcome() {
  const t = todayKey(), d = parseKey(t);
  const st = d.getDate() >= 24 ? keyOf(new Date(d.getFullYear(), d.getMonth(), 24)) : keyOf(new Date(d.getFullYear(), d.getMonth()-1, 24));
  return `<header class="top"><div class="grow"><h1>Spend Log</h1><div class="sub">Daily budgets for Personal, Fuel and Home</div></div></header>
  <div class="card empty" style="text-align:left;display:grid;gap:12px">
    <h3>Get started</h3>
    <p style="margin:0">Restore your backup file to bring in your cycles, budgets and past expenses. Or set up a fresh budget cycle.</p>
    <button class="btn dark" data-act="restore">Restore from backup</button>
    <form id="setup-form" class="form" style="border-top:1px solid var(--line);padding-top:12px">
      <div class="fgrid"><label class="f">Cycle starts<input id="su-start" type="date" value="${st}"></label><label class="f">Cycle ends<input id="su-end" type="date" value="${addDays(keyOf(new Date(parseKey(st).getFullYear(), parseKey(st).getMonth()+1, parseKey(st).getDate())), -1)}"></label></div>
      ${WALLETS.map(w => `<label class="f">${w.label} budget for the cycle <span class="hint">· you can type 10000+600+2000</span><input id="su-${w.k}" inputmode="decimal" placeholder="0"></label>`).join('')}
      <button class="btn primary" type="submit">Start tracking</button>
    </form>
  </div>`;
}
function walletCard(c, w) {
  const m = metrics(c, w.k);
  const pct = m.B ? Math.min(100, Math.max(0, m.spent / m.B * 100)) : 0, pacePct = Math.min(100, m.elapsed / m.N * 100);
  const over = m.spent > m.pace;
  return `<button class="card wallet" data-act="add" data-v="${w.k}" aria-label="Add a ${w.label} expense">
    <div class="h"><span class="dot" style="background:${w.color}"></span><h2>${w.label}</h2><span class="muted num" style="font-size:13px">${money(m.spent)} / ${money(m.B)}</span></div>
    <div class="today"><span class="v num ${m.leftToday < 0 ? 'neg' : ''}">${money(m.leftToday)}</span><span class="l">left today of ${money(m.allowToday)}${m.today ? ` · spent ${money(m.today)}` : ''}</span></div>

  ${(() => { const B = rows.reduce((s,r)=>s+r.m.B,0), sp = rows.reduce((s,r)=>s+r.m.spent,0), sv = rows.reduce((s,r)=>s+(r.m.past ? r.m.B-r.m.spent : r.m.buffer),0); return `<tr><td><b>Total</b></td><td class="num"><b>${money(B)}</b></td><td class="num"><b>${money(sp)}</b></td><td class="num ${sv>=0?'pos':'neg'}"><b>${signed(sv)}</b></td></tr>`; })()}
  </tbody></table></div>`;

  <div class="seg" style="padding-top:0">${[{k:'all',label:'All'}].concat(WALLETS).map(w => `<button class="pill ${wsel===w.k?'on':''}" data-act="hwallet" data-v="${w.k}">${w.label}</button>`).join('')}</div>

  ${cycles.map(x => { const ms = WALLETS.map(w => metrics(x, w.k)); const sv = ms.reduce((s,m)=>s+(m.past ? m.B-m.spent : m.buffer),0);
    return `<tr class="click" data-act="hcycle" data-v="${x.id}"><td>${fmtShort(x.start)}</td>${ms.map(m=>`<td class="num ${m.B && m.spent>m.B?'neg':''}">${money(m.spent)}</td>`).join('')}<td class="num ${sv>=0?'pos':'neg'}">${signed(sv)}</td></tr>`; }).join('')}
  </tbody></table></div><p class="muted" style="font-size:12px;margin:8px 2px">Red means spent more than that wallet’s budget. Saved uses the budget minus spending for finished cycles, and today’s buffer for the current one.</p>`;

function burnChart(c, wsel) {

  const per = new Array(N).fill(0);

  [0, Math.floor((N-1)/2), N-1].forEach(i => s += `<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===N-1?'end':'middle'}" font-size="10" fill="var(--faint)">${fmtShort(addDays(c.start, i))}</text>`);

  if (f.wallet === 'home' && f.itemId) e.itemId = f.itemId;
  if (!cycleFor(date)) { toast('That date isn’t in any budget cycle. Adjust the cycle dates in Budgets.'); }
  const i = S.data.entries.findIndex(x => x.id === e.id);
  if (i >= 0) S.data.entries[i] = e; else S.data.entries.push(e);
  S.lastWallet = f.wallet; saveUi(); save(); closeSheet(); render();
  toast(`${i >= 0 ? 'Saved' : 'Added'} ${money(Math.abs(amount))} ${cur()} · ${WL[f.wallet].label}`);
}
function openItem(it, group) {
  const c = cycleFor(todayKey()) || sortedCycles().at(-1);
  const x = it || {id:null, group, name:'', qty:'', planned:'', bought:0, openingPaid:0};
  const bill = x.group === 'bills';
  S._item = {id: x.id, group: x.group, cycle: c.id};
  const body = `<form class="form" id="item-form">
    <label class="f">Name<input id="it-name" value="${esc(x.name)}" required></label>
    ${bill ? `<label class="f">Expected amount <span class="hint">optional</span><input id="it-planned" inputmode="decimal" value="${esc(x.planned ?? '')}"></label>` :
      `<div class="fgrid"><label class="f">Planned quantity<input id="it-qty" inputmode="decimal" value="${esc(x.qty ?? '')}"></label><label class="f">Planned cost<input id="it-planned" inputmode="decimal" value="${esc(x.planned ?? '')}" placeholder="e.g. 5*20*4"></label></div>
      <label class="f">Bought so far<input id="it-bought" inputmode="decimal" value="${esc(x.bought ?? 0)}"></label>`}
    <label class="f">Paid before using the app <span class="hint">· later payments come from tagged Home expenses</span><input id="it-open" inputmode="decimal" value="${esc(x.openingPaid ?? 0)}"></label>
    ${x.id ? `<p class="muted" style="margin:0;font-size:13px">Paid in total: <b class="num">${money(itemPaid(c, x))}</b></p><button type="button" class="btn danger" data-act="delitem">Remove from this cycle’s list</button>` : ''}
  </form>`;
  openSheet(x.id ? (bill ? 'Edit bill' : 'Edit item') : (bill ? 'Add bill' : 'Add item'), body, `<button class="btn primary" data-act="saveitem">Save</button>`);
}
function saveItem() {
  const c = S.data.cycles.find(x => x.id === S._item.cycle); if (!c) return;
  const name = $('#it-name').value.trim(); if (!name) { toast('Give it a name.'); return; }
  const n = id => { const el = $('#' + id); if (!el) return null; const v = calc(el.value); return v == null || isNaN(v) ? null : v; };
  c.items = c.items || [];
  let it = c.items.find(i => i.id === S._item.id);
  if (!it) { it = {id: 'it' + uid(), group: S._item.group}; c.items.push(it); }
  Object.assign(it, {name, planned: n('it-planned'), openingPaid: n('it-open') || 0});
  if (it.group !== 'bills') Object.assign(it, {qty: n('it-qty'), bought: n('it-bought') || 0});
  save(); closeSheet(); render(); toast('Saved');
}

// ---------- backup / restore ----------
function download(name, text, type) {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
  catch { openSheet('Copy your file', `<textarea readonly style="width:100%;height:240px">${esc(text)}</textarea>`); }
}
function openRestore() {
  openSheet('Restore from backup', `<p class="muted" style="margin-top:0">Pick a Spend Log backup file (.json), or paste its text.</p>
    <label class="btn dark block" for="rs-file">Choose backup file</label><input id="rs-file" type="file" accept=".json,application/json,text/plain" hidden>
    <textarea id="rs-text" placeholder="…or paste the backup text here" style="width:100%;height:110px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px;font-size:13px"></textarea>
    <p class="muted" style="font-size:13px">Restoring replaces what’s on this device with the backup.</p><div id="rs-out"></div>`, `<button class="btn primary" data-act="dorestore">Restore</button>`);
  $('#rs-file').addEventListener('change', async e => { const f = e.target.files[0]; if (f) $('#rs-text').value = await f.text(); });
}
function doRestore() {
  let b; try { b = JSON.parse($('#rs-text').value); } catch { $('#rs-out').innerHTML = '<div class="banner warn">That isn’t a valid backup file.</div>'; return; }
  if (!b || b.app !== 'spend-log' || !Array.isArray(b.cycles) || !Array.isArray(b.entries)) { $('#rs-out').innerHTML = '<div class="banner warn">That file isn’t a Spend Log backup.</div>'; return; }
  S.data = {cycles: b.cycles, entries: b.entries, settings: b.settings || {currency:'EGP'}};
  ensureCurrent(); save(); closeSheet(); S.tab = 'today'; render(); toast(`Restored ${b.entries.length} expenses and ${b.cycles.length} cycles`);
}
function exportCsv() {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const rows = [['Date','Wallet','Amount','Note','Home item','Sum']].concat([...S.data.entries].sort((a,b)=>a.date.localeCompare(b.date)).map(e => [e.date, WL[e.wallet]?.label || e.wallet, e.amount, e.note || '', e.itemId ? itemName(e.itemId) : '', e.expr || '']));
  download(`spend-log-${todayKey()}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'scrim') { if (e.target === el) closeSheet(); return; }
  switch (a) {
    case 'tab': S.tab = v; closeSheet(); render(); scrollTo(0,0); break;
    case 'close': closeSheet(); break;
    case 'add': openEntry(null, v); break;
    case 'edit': { const en = S.data.entries.find(x => x.id === v); if (en) openEntry(en); break; }
    case 'fsign': S._form.refund = v === '1'; syncForm(); break;
    case 'fwallet': S._form.wallet = v; if (v !== 'home') S._form.itemId = null; syncForm(); break;
    case 'fitem': S._form.itemId = v || null; syncForm(); break;
    case 'fnote': $('#en-note').value = v; break;
    case 'fdate': $('#en-date').value = addDays(todayKey(), +v); syncForm(); break;
    case 'saveentry': saveEntry(); break;
    case 'delentry': { const id = S._form.id, old = S.data.entries.find(x => x.id === id); S.data.entries = S.data.entries.filter(x => x.id !== id); save(); closeSheet(); render();
      toast('Expense deleted', {label:'Undo', fn: () => { S.data.entries.push(old); save(); render(); }}); break; }
    case 'toastact': S._toastAct?.(); $('#toast-root').innerHTML = ''; break;
    case 'hcycle': S.histCycle = v; render(); break;
    case 'hwallet': S.histWallet = v; render(); break;
    case 'newitem': openItem(null, v); break;
    case 'edititem': { const c = cycleFor(todayKey()) || sortedCycles().at(-1); const it = (c.items||[]).find(i => i.id === v); if (it) openItem(it); break; }
    case 'saveitem': saveItem(); break;
    case 'delitem': { const c = S.data.cycles.find(x => x.id === S._item.cycle); c.items = c.items.filter(i => i.id !== S._item.id); save(); closeSheet(); render(); toast('Removed'); break; }
    case 'fund': { const c = cycleFor(todayKey()) || sortedCycles().at(-1);
      openSheet('Bills fund', `<label class="f">Money set aside for bills this cycle<input id="fund-v" inputmode="decimal" value="${esc(c.billsFund || '')}"></label>`, `<button class="btn primary" data-act="savefund">Save</button>`); break; }
    case 'savefund': { const c = cycleFor(todayKey()) || sortedCycles().at(-1); const val = calc($('#fund-v').value); c.billsFund = isNaN(val) || val == null ? 0 : val; save(); closeSheet(); render(); break; }
    case 'newcycle': {
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to confirm'; el.classList.add('danger'); break; }
      const t = todayKey(), c = cycleFor(t); if (!c) break;
      if (c.start === t) { toast('This cycle already starts today.'); break; }
      const len = daysBetween(c.start, c.end); c.end = addDays(t, -1);
      const n = nextCycleFrom(c); n.end = addDays(t, len);
      S.data.cycles.push(n); save(); render(); toast(`New cycle ${fmtShort(n.start)} – ${fmtShort(n.end)}`); break; }
    case 'backup': download(`spend-log-backup-${todayKey()}.json`, JSON.stringify({app:'spend-log', version:1, exportedAt:new Date().toISOString(), ...S.data}), 'application/json'); break;
    case 'restore': openRestore(); break;
    case 'dorestore': doRestore(); break;
    case 'csv': exportCsv(); break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.dataset?.calc; if (!id) return;
  const v = calc(e.target.value), out = document.getElementById(id);
  if (out) out.textContent = isExpr(e.target.value) ? (isNaN(v) || v == null ? 'check the sum' : '= ' + money(v)) : '';
});
document.addEventListener('change', e => { if (e.target.id === 'en-date') syncForm(); });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'cycle-form') {
    const c = cycleFor(todayKey()) || sortedCycles().at(-1);
    const st = $('#cy-start').value, en = $('#cy-end').value;
    if (!st || !en || en < st) { toast('Check the cycle dates.'); return; }
    const clash = S.data.cycles.find(x => x !== c && x.start <= en && x.end >= st);
    if (clash) { toast(`Those dates overlap the ${fmtShort(clash.start)} cycle.`); return; }
    for (const w of WALLETS) { const raw = $('#cy-' + w.k).value.trim(), v = calc(raw); if (raw && (v == null || isNaN(v))) { toast(`Check the ${w.label} budget.`); return; } c.budgets[w.k] = {expr: raw, value: v || 0}; }
    const oldId = c.id; c.start = st; c.end = en; c.id = st; if (S.histCycle === oldId) S.histCycle = st;
    save(); render(); toast('Budgets saved');
  }
  if (e.target.id === 'setup-form') {
    const st = $('#su-start').value, en = $('#su-end').value; if (!st || !en || en < st) { toast('Check the dates.'); return; }
    const budgets = {}; for (const w of WALLETS) { const raw = $('#su-' + w.k).value.trim(), v = calc(raw); budgets[w.k] = {expr: raw, value: isNaN(v) || v == null ? 0 : v}; }
    S.data.cycles.push({id: st, start: st, end: en, budgets, billsFund: 0, items: []}); ensureCurrent(); save(); render();
  }
  if (e.target.id === 'item-form') saveItem();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.id === 'en-amt') { e.preventDefault(); saveEntry(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.data.cycles.length) { ensureCurrent(); render(); } });

load(); ensureCurrent(); render();
})();
</script>
</body>
</html>
